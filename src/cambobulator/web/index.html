<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambobulator</title>
<style>
  :root {
    --bg: #15171c; --panel: #1f232b; --line: #313744; --text: #e7e9ee; --muted: #9aa3b2;
    --accent: #6ea8fe; --good: #4cc38a; --bad: #f07178; --warn: #f2c14e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  header .stats { color: var(--muted); font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
  @media (max-width: 700px) { .previews { grid-template-columns: 1fr; } }
  figure { margin: 0; background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
  figcaption { padding: 6px 10px; color: var(--muted); background: var(--panel); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .panel-head h2 { margin: 0; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .row.nowrap { flex-wrap: nowrap; }
  .row label { color: var(--muted); }
  #camera { flex: 1; min-width: 0; }
  input[type=text], input[type=number], select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  input[type=number] { width: 72px; }
  button { background: #2b3240; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--good); color: #0b1220; border-color: var(--good); font-weight: 600; }
  button.icon { padding: 3px 8px; flex: none; }
  .error { color: var(--bad); white-space: pre-wrap; font-size: 12px; }
  .warn { color: var(--warn); font-size: 12px; }
  .muted { color: var(--muted); font-size: 12px; }
  .toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  #params h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; padding-top: 8px; border-top: 1px solid var(--line); }
  .panel.off #params, .panel.off #actions { opacity: .5; }
  .param { display: grid; grid-template-columns: 150px 1fr 48px; gap: 8px; align-items: center; margin: 4px 0; }
  .param .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .param input[type=range] { width: 100%; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .status { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>Cambobulator</h1>
  <button id="vcam">Virtual camera: …</button>
  <span id="vcamDevice" class="muted"></span>
  <span class="spacer"></span>
  <span class="stats" id="stats"></span>
</header>
<main>
  <section>
    <div class="previews">
      <figure><img src="/stream/raw.mjpg" alt="Raw camera"><figcaption>Camera (raw)</figcaption></figure>
      <figure><img src="/stream/out.mjpg" alt="Processed output"><figcaption>Output (what others see)</figcaption></figure>
    </div>
    <div id="vcamError" class="error"></div>
    <div id="sourceError" class="error"></div>
  </section>
  <aside>
    <div class="panel">
      <h2>Source</h2>
      <div class="row nowrap">
        <select id="camera"></select>
        <button id="refreshCams" class="icon" title="Look for cameras again">↻</button>
      </div>
      <div class="row">
        <input id="sourceText" type="text" placeholder="camera index, 'synthetic' or video path" style="flex:1">
      </div>
      <div class="row">
        <label>Size</label><input id="width" type="number" min="160" step="16">×<input id="height" type="number" min="120" step="8">
        <label>FPS</label><input id="fps" type="number" min="1" max="120" style="width:56px">
      </div>
      <div class="row"><button class="primary" id="applySource">Use this source</button></div>
      <div class="muted" id="camNote"></div>
    </div>
    <div class="panel" id="effect">
      <div class="panel-head">
        <h2 id="effectName">Effect</h2>
        <label class="toggle" title="Turn the effect off to see the plain camera"><input type="checkbox" id="effectOn"> On</label>
      </div>
      <div id="params"></div>
      <div class="actions" id="actions"></div>
      <div class="status" id="status"></div>
      <div class="muted" id="configPath"></div>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = null, renderedVersion = -1;
const effect = () => state.chain[0];

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) { const t = await res.text(); alert(`${path}: ${t}`); throw new Error(t); }
  return res.json();
}

function fmt(p, v) {
  if (p.kind === "int") return String(v);
  if (p.kind === "float") return (Math.abs(p.max - p.min) <= 1.5 ? v.toFixed(2) : v.toFixed(1));
  return String(v);
}

// Send slider changes at most every 60 ms while dragging, and always send the last value.
function throttle(fn, ms) {
  let last = 0, timer = null, pending = null;
  return (...args) => {
    pending = args;
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(...pending); pending = null; }
    else if (!timer) timer = setTimeout(() => { timer = null; last = Date.now(); if (pending) fn(...pending); pending = null; }, ms);
  };
}

function paramControl(slot, p) {
  const wrap = document.createElement("div");
  wrap.className = "param";
  wrap.title = p.help || "";
  const label = document.createElement("label");
  label.textContent = p.label;
  const val = document.createElement("span");
  val.className = "val";
  let input;
  const send = throttle((v) => api("POST", `/api/filters/${slot.id}/params`, { [p.name]: v }), 60);
  if (p.kind === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!p.value;
    input.onchange = () => send(input.checked);
  } else if (p.kind === "choice") {
    input = document.createElement("select");
    for (const c of p.choices) { const o = new Option(c, c); input.add(o); }
    input.value = p.value;
    input.onchange = () => send(input.value);
  } else {
    input = document.createElement("input");
    input.type = "range";
    input.min = p.min; input.max = p.max; input.step = p.step || (p.kind === "int" ? 1 : 0.01);
    input.value = p.value;
    val.textContent = fmt(p, p.value);
    input.oninput = () => {
      const v = p.kind === "int" ? parseInt(input.value) : parseFloat(input.value);
      val.textContent = fmt(p, v);
      send(v);
    };
  }
  wrap.append(label, input, val);
  return wrap;
}

function renderEffect() {
  const slot = effect();
  $("effectName").textContent = slot.label;
  $("effectName").title = slot.description;
  $("effectOn").checked = slot.enabled;
  $("effect").classList.toggle("off", !slot.enabled);
  const params = $("params");
  params.innerHTML = "";
  let group = null;
  for (const p of slot.params) {
    if (p.group && p.group !== group) {
      group = p.group;
      const h = document.createElement("h3"); h.textContent = group; params.append(h);
    }
    params.append(paramControl(slot, p));
  }
  // The buttons belong to the last group (Background).
  const acts = $("actions");
  acts.innerHTML = "";
  for (const a of slot.actions) {
    const b = document.createElement("button");
    b.textContent = a.label; b.title = a.help || "";
    b.dataset.action = a.name; b.dataset.label = a.label;
    b.onclick = async () => { await api("POST", `/api/filters/${slot.id}/actions/${a.name}`); refresh(); };
    acts.append(b);
  }
  renderedVersion = state.chain_version;
  renderStatus();
}

function renderStatus() {
  const slot = effect();
  const st = slot.status || {};
  const capture = document.querySelector('#actions button[data-action="capture_background"]');
  const counting = st.countdown !== null && st.countdown !== undefined;
  if (capture) {
    capture.disabled = counting;
    capture.textContent = !counting ? capture.dataset.label
      : st.countdown > 0 ? `Capturing in ${Math.ceil(st.countdown)} s… step out of frame` : "Capturing…";
  }
  const parts = [];
  for (const [k, v] of Object.entries(st)) {
    if (v === null || v === "" || k === "warning" || k === "countdown") continue;
    parts.push(`${k.replace(/_/g, " ")}: ${v}`);
  }
  const box = $("status");
  box.innerHTML = "";
  const m = document.createElement("div"); m.className = "muted"; m.textContent = parts.join(" · ");
  box.append(m);
  if (st.warning) { const w = document.createElement("div"); w.className = "warn"; w.textContent = st.warning; box.append(w); }
  if (slot.error) { const e = document.createElement("div"); e.className = "error"; e.textContent = "Error: " + slot.error; box.append(e); }
}

function renderHeader() {
  const v = state.virtual_camera;
  const b = $("vcam");
  b.textContent = v.running ? "Virtual camera: ON" : "Virtual camera: OFF";
  b.className = v.running ? "on" : "";
  $("vcamDevice").textContent = v.running && v.device ? `→ ${v.device}` : "";
  $("vcamError").textContent = v.error || "";
  $("sourceError").textContent = state.source_error || "";
  const s = state.stats;
  const size = s.source_size ? `${s.source_size[0]}×${s.source_size[1]}` : "";
  $("stats").textContent = s.source ? `${s.source} ${size} · ${s.fps} fps · ${s.process_ms} ms/frame` : "no source";
  $("configPath").textContent = state.config_path ? `Settings auto-save to ${state.config_path}` : "";
}

async function refresh(force) {
  state = await api("GET", "/api/state");
  renderHeader();
  if (force || state.chain_version !== renderedVersion) renderEffect(); else renderStatus();
}

async function loadCameras() {
  const sel = $("camera");
  sel.innerHTML = "";
  sel.add(new Option("Scanning…", ""));
  let cams = [];
  try { cams = await api("GET", "/api/cameras"); } catch (e) {}
  sel.innerHTML = "";
  for (const c of cams) sel.add(new Option(`${c.index}: ${c.name}${c.is_virtual ? " (virtual – don't use as source)" : ""}`, c.source));
  sel.add(new Option("Synthetic test pattern", "synthetic"));
  sel.add(new Option("Other (type below)…", "__other"));
  const cur = state.settings.source;
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : "__other";
  $("sourceText").value = cur;
  $("camNote").textContent = cams.length ? "" : "No cameras found. You can still use a video file or the synthetic pattern.";
}

$("camera").onchange = () => { const v = $("camera").value; if (v !== "__other") $("sourceText").value = v; };
$("refreshCams").onclick = loadCameras;
$("applySource").onclick = async () => {
  $("applySource").disabled = true;
  try {
    await api("POST", "/api/source", {
      source: $("sourceText").value.trim(), width: +$("width").value, height: +$("height").value, fps: +$("fps").value,
    });
  } finally { $("applySource").disabled = false; }
  refresh(true);
};
$("vcam").onclick = async () => {
  await api("POST", "/api/virtual-camera", { enabled: !state.virtual_camera.running });
  refresh();
};
$("effectOn").onchange = async () => {
  await api("POST", `/api/filters/${effect().id}/enabled`, { enabled: $("effectOn").checked });
  refresh(true);
};

(async () => {
  await refresh(true);
  $("width").value = state.settings.width; $("height").value = state.settings.height; $("fps").value = state.settings.fps;
  loadCameras();
  setInterval(() => refresh(false).catch(() => {}), 1000);
})();
</script>
</body>
</html>

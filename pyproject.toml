[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cambobulator"
version = "0.1.0"
description = "A software-defined virtual webcam: real camera -> filter chain -> virtual camera."
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Operating System :: Microsoft :: Windows"]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    # 4.9+: older dnn modules run the bundled segmentation model wrong.
    "opencv-python>=4.9",
    "pyvirtualcam>=0.11",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
build = ["pyinstaller>=6.10"]

[project.scripts]
cambobulator = "cambobulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cambobulator = ["web/*.html", "models/*", "virtualcam/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
